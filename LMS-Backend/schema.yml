components:
  schemas:
    AcademicYearEnum:
      enum:
      - 1st Year
      - 2nd Year
      - 3rd Year
      type: string
      description: |-
        * `1st Year` - 1st Year
        * `2nd Year` - 2nd Year
        * `3rd Year` - 3rd Year
    ActionEnum:
      enum:
      - Create
      - Update
      - Cancel
      - Verify
      - Issue
      - Return
      type: string
      description: |-
        * `Create` - Create
        * `Update` - Update
        * `Cancel` - Cancel
        * `Verify` - Verify
        * `Issue` - Issue
        * `Return` - Return
    AdminUserWrite:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        username:
          type: string
          description: Required. 150 characters or fewer. Letters, digits and @/./+/-/_
            only.
          pattern: ^[\w.@+-]+$
          maxLength: 150
        name:
          type: string
          maxLength: 150
        role:
          $ref: '#/components/schemas/RoleEnum'
        status:
          $ref: '#/components/schemas/StatusE75Enum'
        email:
          title: Email address
          oneOf:
          - type: string
            format: email
            maxLength: 254
          - type: string
            maxLength: 0
        phone:
          type: string
          maxLength: 15
      required:
      - id
      - name
      - username
    AdminUserWriteRequest:
      type: object
      properties:
        username:
          type: string
          minLength: 1
          description: Required. 150 characters or fewer. Letters, digits and @/./+/-/_
            only.
          pattern: ^[\w.@+-]+$
          maxLength: 150
        password:
          type: string
          writeOnly: true
          minLength: 1
        name:
          type: string
          minLength: 1
          maxLength: 150
        role:
          $ref: '#/components/schemas/RoleEnum'
        status:
          $ref: '#/components/schemas/StatusE75Enum'
        email:
          title: Email address
          oneOf:
          - type: string
            format: email
            maxLength: 254
          - type: string
            maxLength: 0
        phone:
          type: string
          maxLength: 15
        roll_number:
          type: string
          writeOnly: true
      required:
      - name
      - username
    Book:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        accession_number:
          type: string
          maxLength: 30
        title:
          type: string
          maxLength: 300
        author:
          type: string
          maxLength: 200
        category:
          $ref: '#/components/schemas/Category71bEnum'
        classification:
          $ref: '#/components/schemas/ClassificationEnum'
        subject:
          type: string
          maxLength: 150
        price:
          type: number
          format: double
          maximum: 100000000
          minimum: -100000000
          exclusiveMaximum: true
          exclusiveMinimum: true
        isbn:
          type: string
          maxLength: 20
        publisher:
          type: string
          maxLength: 150
        edition:
          type: string
          maxLength: 50
        total_copies:
          type: integer
          readOnly: true
        available_copies:
          type: integer
          readOnly: true
        shelf_location:
          type: string
          maxLength: 50
        status:
          allOf:
          - $ref: '#/components/schemas/Status1ddEnum'
          readOnly: true
        library_use_only:
          type: boolean
        cover_image:
          oneOf:
          - type: string
            format: uri
            maxLength: 200
          - type: string
            maxLength: 0
        acquisition_date:
          type: string
          format: date
          nullable: true
        acquisition_source:
          type: string
          maxLength: 150
        added_date:
          type: string
          format: date
          readOnly: true
        syllabus:
          type: array
          items:
            $ref: '#/components/schemas/SyllabusTag'
          nullable: true
      required:
      - accession_number
      - added_date
      - author
      - available_copies
      - category
      - classification
      - id
      - shelf_location
      - status
      - title
      - total_copies
    BookDetail:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        accession_number:
          type: string
          maxLength: 30
        title:
          type: string
          maxLength: 300
        author:
          type: string
          maxLength: 200
        category:
          $ref: '#/components/schemas/Category71bEnum'
        classification:
          $ref: '#/components/schemas/ClassificationEnum'
        subject:
          type: string
          maxLength: 150
        price:
          type: number
          format: double
          maximum: 100000000
          minimum: -100000000
          exclusiveMaximum: true
          exclusiveMinimum: true
        isbn:
          type: string
          maxLength: 20
        publisher:
          type: string
          maxLength: 150
        edition:
          type: string
          maxLength: 50
        total_copies:
          type: integer
          readOnly: true
        available_copies:
          type: integer
          readOnly: true
        shelf_location:
          type: string
          maxLength: 50
        status:
