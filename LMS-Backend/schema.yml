                $ref: '#/components/schemas/TokenRefresh'
          description: ''
  /api/v1/book-requests/:
    get:
      operationId: v1_book_requests_list
      description: |-
        Mixin (combine with a DRF viewset): sets `module_permissions = {action_or_method: (module, action)}`.

        Plain mixin rather than a GenericViewSet subclass, so it composes cleanly with
        `viewsets.ModelViewSet`/`ReadOnlyModelViewSet` without an MRO clash.
      parameters:
      - name: ordering
        required: false
        in: query
        description: Which field to use when ordering the results.
        schema:
          type: string
      - name: page
        required: false
        in: query
        description: A page number within the paginated result set.
        schema:
          type: integer
      - name: pageSize
        required: false
        in: query
        description: Number of results to return per page.
        schema:
          type: integer
      - name: search
        required: false
        in: query
        description: A search term.
        schema:
          type: string
      - in: query
        name: status
        schema:
          type: string
          enum:
          - Approved
          - Cancelled
          - Expired
          - Issued
          - Pending
          - Rejected
        description: |-
          * `Pending` - Pending
          * `Approved` - Approved
          * `Rejected` - Rejected
          * `Issued` - Issued
          * `Cancelled` - Cancelled
          * `Expired` - Expired
      tags:
      - v1
      security:
      - jwtAuth: []
      - cookieAuth: []
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedBookRequestList'
          description: ''
